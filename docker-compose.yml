services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fws-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - FWS_DATABASE_URL=postgresql+asyncpg://fws:fws_secret@db:5432/fruewarnsystem
      - FWS_DATABASE_URL_SYNC=postgresql://fws:fws_secret@db:5432/fruewarnsystem
      - FWS_REDIS_URL=redis://redis:6379/0
      - FWS_OLLAMA_URL=http://ollama:11434
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - fws-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fws-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://backend:8000/ws
    depends_on:
      - backend
    networks:
      - fws-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgis/postgis:16-3.4
    container_name: fws-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fruewarnsystem
      POSTGRES_USER: fws
      POSTGRES_PASSWORD: fws_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - fws-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fws -d fruewarnsystem"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fws-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fws-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: fws-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - fws-network
    deploy:
      resources:
        limits:
          memory: 8G

  nginx:
    image: nginx:alpine
    container_name: fws-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - fws-network

  prometheus:
    image: prom/prometheus:latest
    container_name: fws-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - fws-network

  grafana:
    image: grafana/grafana:latest
    container_name: fws-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - fws-network

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: fws-uptime
    restart: unless-stopped
    ports:
      - "3002:3001"
    volumes:
      - uptime_data:/app/data
    networks:
      - fws-network

  autoupdate:
    build:
      context: ./docker/autoupdate
      dockerfile: Dockerfile
    container_name: fws-autoupdate
    restart: unless-stopped
    environment:
      - REPO_DIR=/repo
      - COMPOSE_FILE=/repo/docker-compose.yml
      - UPDATE_BRANCH=main
      - CHECK_INTERVAL=1800
      - NTFY_TOPIC=${FWS_NTFY_TOPIC:-drk-troisdorf-fws}
      - NTFY_SERVER=${FWS_NTFY_SERVER:-https://ntfy.sh}
    volumes:
      - ./:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - fws-network

  mqtt:
    image: eclipse-mosquitto:2
    container_name: fws-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
    networks:
      - fws-network

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  prometheus_data:
  grafana_data:
  uptime_data:
  certbot_data:
  mqtt_data:

networks:
  fws-network:
    driver: bridge
